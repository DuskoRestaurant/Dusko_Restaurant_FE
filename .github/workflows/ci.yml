name: Frontend checks
on:
  push:
    branches: [main, Tong, 'work/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build:all
        env:
          VITE_API_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_STAFF_APP_URL: ${{ vars.VITE_STAFF_APP_URL }}
          VITE_MANAGEMENT_APP_URL: ${{ vars.VITE_MANAGEMENT_APP_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: |
            dist/
            staff-app/dist/
            customer-web/dist/
          retention-days: 7
          if-no-files-found: error
